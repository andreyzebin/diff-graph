llm:
  # Any OpenAI-compatible endpoint.
  # Leave api_url empty to use OpenAI directly.
  api_url: ""
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o-mini"

render:
  max_tokens: 8000

explore:
  depth: 2
  max_callers: 5        # max impacted files to extract per changed module
  exclude_tests: true   # skip test files in impact results
  max_agent_steps: 32     # max tool calls per impact agent run
  max_agent_tokens: 20000 # stop agent if cumulative token usage exceeds this
