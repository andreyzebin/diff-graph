llm:
  # Any OpenAI-compatible endpoint.
  # Leave api_url empty to use OpenAI directly.
  api_url: ""
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o-mini"
  # CA bundle for LLM endpoint TLS (corporate proxy/self-signed).
  # Separate from REQUESTS_CA_BUNDLE (which is for Bitbucket).
  # Also configurable via LLM_CA_BUNDLE env var.
  ca_bundle: ""

review:
  max_steps: 40          # max ReAct tool calls per review
  max_tokens: 40000      # stop agent if cumulative token usage exceeds this
