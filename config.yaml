llm:
  # Any OpenAI-compatible endpoint.
  # Leave api_url empty to use OpenAI directly.
  api_url: ""
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o-mini"
  # CA bundle for LLM endpoint TLS (corporate proxy/self-signed).
  # Separate from REQUESTS_CA_BUNDLE (which is for Bitbucket).
  # Also configurable via LLM_CA_BUNDLE env var.
  ca_bundle: ""
  timeout: 600             # LLM request timeout in seconds
  tool_choice: "required"  # "required" (default) or "auto" for models that don't support required

  # Vendor extensions and streaming knobs can be set here, but most
  # setups are simpler to manage as named profiles in
  # ~/repos/.llm_creds.toml — pick one with `cli.py run --provider <name>`.
  # See .llm_creds.toml.example for the full schema.
  #
  # extra_body:
  #   chat_template_kwargs:
  #     enable_thinking: false   # required for Qwen3-Coder on vLLM —
  #                              # without it the qwen3 tool parser leaks
  #                              # <think>…</think> / `</parameter>` XML
  #                              # fragments into the JSON tool arguments.
  #
  # stream: false             # rare — only needed if a backend's
  #                           # streaming tool parser is broken and
  #                           # non-streamed mode is your only option.

review:
  max_steps: 40          # max ReAct tool calls per review
  max_tokens: 40000      # stop agent if cumulative token usage exceeds this
  bot_user: ""           # Bitbucket username/slug of the bot account — own comments marked [SELF]
  comment_tag: "dg"      # prefix for the traceability footer appended to posted comments
                         # (`<prefix>:<gen>:<mutation>:<run>`). Empty string disables tagging.

# ── Jira servers (optional) ───────────────────────────────────────────────────
# The `jira_read_ticket` tool resolves a `handle/namespace/ticket_id` ref against
# this registry. The `handle` is a slash-free logical id; the URL + auth are
# attributes. A single-server setup needs NOTHING here — the `default` handle
# falls back to JIRA_URL / JIRA_TOKEN from the env. Define entries only when
# you have more than one tracker. Secrets stay in the env via ${VAR}.
# Override per-machine in config.local.yaml.
#
# jira_servers:
#   default:
#     url: "https://jira.example.com"
#     token: "${JIRA_TOKEN}"
#     # ca_bundle / client_cert default to the shared Bitbucket TLS material
#   other-tracker:
#     url: "https://other.example/jira"
#     token: "${OTHER_JIRA_TOKEN}"
