<!DOCTYPE html>
<html>
<head>
<title>QA · Overview</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
         gap: 12px; margin: 16px 0; }
.card { background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 6px; }
.card .label { color: #8b949e; font-size: 0.85em; }
.card .value { font-size: 1.8em; color: #c9d1d9; margin-top: 4px;
               font-variant-numeric: tabular-nums; }
.section { margin-top: 24px; }
.section h2 { font-size: 1em; color: #8b949e; margin-bottom: 8px; font-weight: normal; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.tn { font-variant-numeric: tabular-nums; text-align: right; }
.gene-chip { color: #58a6ff; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="qa-nav">
  <a href="{{ base_path }}/qa/"><b>overview</b></a>
  <a href="{{ base_path }}/qa/runs">runs</a>
  <a href="{{ base_path }}/qa/plans">plans</a>
  <a href="{{ base_path }}/qa/genes">genes</a>
  <a href="{{ base_path }}/">traces</a>
</div>

<h1>QA · Overview</h1>

<div x-data="dash()" x-init="load()">
  <div class="cards">
    <div class="card">
      <div class="label">total runs</div>
      <div class="value" x-text="totalRuns"></div>
    </div>
    <div class="card">
      <div class="label">agent runs</div>
      <div class="value" x-text="agentRuns"></div>
    </div>
    <div class="card">
      <div class="label">judge runs</div>
      <div class="value" x-text="judgeRuns"></div>
    </div>
    <div class="card">
      <div class="label">unique mutations</div>
      <div class="value" x-text="mutations"></div>
    </div>
    <div class="card">
      <div class="label">scenarios touched</div>
      <div class="value" x-text="scenarios"></div>
    </div>
    <div class="card">
      <div class="label">genes detected</div>
      <div class="value" x-text="genes.length"></div>
    </div>
  </div>

  <div class="section">
    <h2>by provider</h2>
    <table>
      <thead><tr>
        <th>model</th><th class="tn">runs</th><th class="tn">avg dur ms</th>
        <th class="tn">completed</th><th class="tn">errored</th>
      </tr></thead>
      <tbody>
        <template x-for="p in byProvider" :key="p.model">
          <tr>
            <td x-text="p.model"></td>
            <td class="tn" x-text="p.runs"></td>
            <td class="tn" x-text="Math.round(p.avg_duration_ms || 0)"></td>
            <td class="tn" x-text="p.completed"></td>
            <td class="tn" x-text="p.errored"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>by scenario</h2>
    <table>
      <thead><tr>
        <th>scenario</th><th class="tn">runs</th><th class="tn">avg dur ms</th><th class="tn">completed</th>
      </tr></thead>
      <tbody>
        <template x-for="s in byScenario" :key="s.scenario_id">
          <tr>
            <td><a class="run-link" :href="`{{ base_path }}/qa/runs?scenario=${s.scenario_id}`" x-text="s.scenario_id"></a></td>
            <td class="tn" x-text="s.runs"></td>
            <td class="tn" x-text="Math.round(s.avg_duration_ms || 0)"></td>
            <td class="tn" x-text="s.completed"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>genes (run counts)</h2>
    <table>
      <thead><tr><th>gene</th><th class="tn">runs</th></tr></thead>
      <tbody>
        <template x-for="g in genes" :key="g.gene">
          <tr>
            <td><a class="run-link gene-chip" :href="`{{ base_path }}/qa/runs?gene=${g.gene}`" x-text="g.gene"></a></td>
            <td class="tn" x-text="g.runs_count"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
function dash() {
  return {
    totalRuns: '…', agentRuns: '…', judgeRuns: '…',
    mutations: '…', scenarios: '…',
    byProvider: [], byScenario: [], genes: [],
    async load() {
      const get = async (path) => (await (await fetch(`{{ base_path }}${path}`)).json()).data;

      // counts via /api/search/runs?limit=1 — we just need meta.total
      const fetchCount = async (extra = '') => {
        const r = await (await fetch(`{{ base_path }}/api/search/runs?limit=1${extra}`)).json();
        return (r.meta && r.meta.total) || 0;
      };
      this.totalRuns = await fetchCount();
      this.agentRuns = await fetchCount('&kind=agent');
      this.judgeRuns = await fetchCount('&kind=judge');

      this.byProvider = await get('/api/search/aggregates/by_provider');
      this.byScenario = await get('/api/search/aggregates/by_scenario');
      this.genes = await get('/api/search/genes');

      // unique mutations / scenarios — count distinct keys via tables loaded
      this.scenarios = this.byScenario.length;
      const muts = new Set();
      // crude — sample first page of runs to estimate; replace with /api/aggregates/by_mutation later
      const runs = await get('/api/search/runs?limit=200');
      runs.forEach(r => { if (r.mutation) muts.add(r.mutation); });
      this.mutations = muts.size;
    },
  };
}
</script>
</body>
</html>
