<!DOCTYPE html>
<html>
<head>
<title>QA · Overview</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script>window.QA_BASE_PATH = "{{ base_path }}";</script>
<script defer src="{{ base_path }}/static/qa.js?v=888d7b8a"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
         gap: 12px; margin: 16px 0; }
.card { background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 6px; }
.card .label { color: #8b949e; font-size: 0.85em; }
.card .value { font-size: 1.8em; color: #c9d1d9; margin-top: 4px;
               font-variant-numeric: tabular-nums; }
.section { margin-top: 24px; }
.section h2 { font-size: 1em; color: #8b949e; margin-bottom: 8px; font-weight: normal; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.tn { font-variant-numeric: tabular-nums; text-align: right; }
</style>
</head>
<body hx-boost="true" hx-ext="head-support">
{% include "_qa_nav.html" %}

<h1>QA · Overview</h1>

<div x-data="dash" x-init="load(); setInterval(() => load(), 10000)">
  <div class="cards">
    <div class="card">
      <div class="label">total runs</div>
      <div class="value" x-text="totalRuns"></div>
    </div>
    <div class="card">
      <div class="label">agent runs</div>
      <div class="value" x-text="agentRuns"></div>
    </div>
    <div class="card">
      <div class="label">judge runs</div>
      <div class="value" x-text="judgeRuns"></div>
    </div>
    <div class="card">
      <div class="label">unique mutations</div>
      <div class="value" x-text="mutations"></div>
    </div>
    <div class="card">
      <div class="label">scenarios touched</div>
      <div class="value" x-text="scenarios"></div>
    </div>
  </div>

  <div class="section">
    <h2>by provider</h2>
    <table>
      <thead><tr>
        <th>model</th><th class="tn">runs</th><th class="tn">avg dur ms</th>
        <th class="tn">completed</th><th class="tn">errored</th>
      </tr></thead>
      <tbody>
        <template x-for="p in byProvider" :key="p.model">
          <tr>
            <td x-text="p.model"></td>
            <td class="tn" x-text="p.runs"></td>
            <td class="tn" x-text="Math.round(p.avg_duration_ms || 0)"></td>
            <td class="tn" x-text="p.completed"></td>
            <td class="tn" x-text="p.errored"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>by scenario</h2>
    <table>
      <thead><tr>
        <th>scenario</th><th class="tn">runs</th><th class="tn">avg dur ms</th><th class="tn">completed</th>
      </tr></thead>
      <tbody>
        <template x-for="s in byScenario" :key="s.scenario_id">
          <tr>
            <td><a class="run-link" :href="`{{ base_path }}/qa/runs?scenario=${s.scenario_id}`" x-text="s.scenario_id"></a></td>
            <td class="tn" x-text="s.runs"></td>
            <td class="tn" x-text="Math.round(s.avg_duration_ms || 0)"></td>
            <td class="tn" x-text="s.completed"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</div>


</body>
</html>
