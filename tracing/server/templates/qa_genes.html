<!DOCTYPE html>
<html>
<head>
<title>QA · Genes</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script>window.QA_BASE_PATH = "{{ base_path }}";</script>
<script defer src="{{ base_path }}/static/qa.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/idiomorph@0.3.0"></script>
<script defer src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.gene { color: #58a6ff; font-family: ui-monospace, monospace; text-decoration: none; }
.gene:hover { text-decoration: underline; }
.tn { font-variant-numeric: tabular-nums; text-align: right; }
.bar-with { display: inline-block; background: #56d36433; height: 8px; vertical-align: middle; }
.bar-without { display: inline-block; background: #30363d; height: 8px; vertical-align: middle; }
.empty { color: #8b949e; padding: 40px; text-align: center; }
</style>
</head>
<body hx-boost="true" hx-ext="morph,head-support" hx-swap="morph">
{% include "_qa_nav.html" %}

<h1>QA · Genes</h1>
<p style="color: #8b949e; font-size: 0.9em;">
Auto-detected from prompt content at run start. Click a gene to filter runs.
</p>

<div x-data="genesView" x-init="load()">
  <template x-if="rows.length === 0">
    <div class="empty">no genes detected yet</div>
  </template>

  <template x-if="rows.length > 0">
    <table>
      <thead><tr>
        <th>gene</th><th class="tn">runs with</th><th class="tn">runs without</th>
        <th>presence</th>
      </tr></thead>
      <tbody>
        <template x-for="g in rows" :key="g.gene">
          <tr>
            <td><a class="gene" :href="`{{ base_path }}/qa/runs?gene=${g.gene}`" x-text="g.gene"></a></td>
            <td class="tn" x-text="g.runs_with"></td>
            <td class="tn" x-text="g.runs_without"></td>
            <td>
              <span class="bar-with" :style="`width: ${(g.runs_with / total * 200).toFixed(0)}px;`"></span><span class="bar-without" :style="`width: ${(g.runs_without / total * 200).toFixed(0)}px;`"></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </template>
</div>


</body>
</html>
