<!DOCTYPE html>
<html>
<head>
<title>🔴 LIVE · {{ run_id[:12] }}</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<style>
body { padding: 20px; max-width: 1000px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, monospace; background: #0d1117; color: #c9d1d9; }
.live-badge { background: #da3633; color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 0.8em; font-weight: bold; animation: pulse 2s infinite; }
.done-badge { background: #238636; color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
h1 { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 1.3em; }
.meta { color: #8b949e; font-size: 0.85em; margin-bottom: 20px; }

#log { font-family: monospace; font-size: 0.85em; line-height: 1.6; }
.log-line { padding: 1px 0; }
.log-agent { color: #58a6ff; font-weight: bold; }
.log-step { color: #8b949e; }
.log-tool { color: #79c0ff; }
.log-paid { color: #8b949e; font-size: 0.8em; }
.log-reflect { color: #c69026; }
.log-conf { font-weight: bold; padding: 1px 6px; border-radius: 8px; font-size: 0.8em; border: 1px solid; }
.log-conf-low { border-color: #da363366; color: #f47067; }
.log-conf-medium { border-color: #9e6a0366; color: #c69026; }
.log-conf-high { border-color: #23863666; color: #56d364; }
.log-question { color: #c69026; margin-left: 20px; }
.log-resolved { margin-left: 20px; }
.log-resolved-answered { color: #56d364; }
.log-resolved-dropped { color: #8b949e; }
.log-tool-name { color: #79c0ff; }
.log-tool-args { color: #8b949e; }
.log-agent-tag { font-size: 0.8em; font-weight: bold; opacity: 0.85; }
.log-spawn { color: #58a6ff; font-style: italic; }
.log-child { margin-left: 20px; color: #8b949e; }
.log-child-done { color: #56d364; }
.log-finding { margin-left: 10px; padding: 2px 0; }
.log-sev { padding: 1px 5px; border-radius: 3px; font-size: 0.75em; font-weight: bold; border: 1px solid; }
.log-sev-blocker { border-color: #da363366; color: #f47067; }
.log-sev-major { border-color: #9e6a0366; color: #c69026; }
.log-sev-minor { border-color: #388bfd33; color: #79c0ff; }
.log-separator { border-top: 1px solid #30363d; margin: 8px 0; }
.nav-link { font-size: 0.6em; font-weight: normal; color: #8b949e; text-decoration: none;
            border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; margin-left: auto; }
.nav-link:hover { color: #58a6ff; border-color: #58a6ff; }
</style>
</head>
<body>
<h1>
  <span id="status-badge" class="live-badge">LIVE</span>
  Trace · {{ run_id[:12] }}
  <a href="{{ base_path }}/runs/{{ run_id }}/trace" class="nav-link">Navigator ⧉</a>
</h1>
<div class="meta">
  <a href="{{ base_path }}/" style="color:#8b949e;text-decoration:none">← runs</a> ·
  Model: {{ run_meta.get('model', '?') }} · Started: {{ (run_meta.get('started_at', '?'))[:19] }}
</div>

<div id="log"></div>

<script>
const BASE = '{{ base_path }}';
const runId = '{{ run_id }}';
const log = document.getElementById('log');
const agents = {};  // agent_id -> {name, steps, paid, isChild, color}
let rootAgent = null;
const childColors = ['#d2a8ff', '#7ee787', '#ffa657', '#79c0ff', '#ff7b72', '#a5d6ff'];
let nextColor = 0;

async function connect() {
  // Bulk-load existing events first
  let lastId = 0;
  try {
    const resp = await fetch(`${BASE}/api/runs/${runId}/events`);
    const events = await resp.json();
    for (const ev of events) {
      handleEvent(ev);
      if (ev.id > lastId) lastId = ev.id;
    }
  } catch(e) {}

  // Then subscribe to new events via WebSocket
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}${BASE}/ws/live/${runId}?after=${lastId}`);

  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);

    if (ev.event_type === 'run_complete') {
      document.getElementById('status-badge').className = 'done-badge';
      document.getElementById('status-badge').textContent = '✓ DONE';
      addLine('<div class="log-separator"></div>');
      addLine('<span class="log-agent">Done</span> — <a href="' + BASE + '/runs/' + runId + '/trace" style="color:#58a6ff">Open Navigator</a>');
      return;
    }

    handleEvent(ev);
  };

  ws.onclose = () => {
    const badge = document.getElementById('status-badge');
    if (badge.textContent === 'LIVE') {
      badge.className = 'done-badge';
      badge.textContent = 'DISCONNECTED';
    }
  };

  ws.onerror = () => ws.close();
}

function handleEvent(ev) {
  const aid = ev.agent_id;
  const aname = ev.agent_name || aid.substring(0, 8);
  const data = ev.data || {};
  const step = ev.step;

  // Track agents
  if (aid && !agents[aid]) {
    agents[aid] = { name: aname, steps: 0, paid: 0, isChild: false, color: null, shortFocus: '' };
    if (!rootAgent) rootAgent = aid;
    else {
      agents[aid].isChild = true;
      agents[aid].color = childColors[nextColor % childColors.length];
      nextColor++;
    }
  }
  if (aid && agents[aid]) {
    agents[aid].steps = Math.max(agents[aid].steps, (step || 0) + 1);
  }

  const ag = aid ? agents[aid] : null;
  const isChild = ag && ag.isChild;
  const tag = isChild ? `<span class="log-agent-tag" style="color:${ag.color}">[${esc(ag.name)}${ag.shortFocus ? ':' + esc(ag.shortFocus) : ''}]</span> ` : '';

  switch (ev.event_type) {
    case 'agent_started':
      if (!isChild) {
        addLine(`<span class="log-agent">${esc(aname)}</span> started`);
      }
      break;

    case 'agent_spawned': {
      const childId = data.child_id || '';
      const childName = data.agent_name || '?';
      const focus = data.focus || '';
      const shortFocus = focus.split(/[\s:,]/)[0].substring(0, 12);
      // Pre-register child so its events get the tag
      if (childId && !agents[childId]) {
        agents[childId] = { name: childName, steps: 0, paid: 0, isChild: true, color: childColors[nextColor % childColors.length], shortFocus };
        nextColor++;
      } else if (childId && agents[childId]) {
        agents[childId].shortFocus = shortFocus;
      }
      addLine(`<span class="log-spawn">spawn ${esc(childName)}</span> ${focus ? '→ ' + esc(focus.substring(0, 80)) + '…' : ''}`);
      break;
    }

    case 'agent_step': {
      const tools = data.tools || [];
      const toolStr = data.tool || '(text)';
      const textPreview = data.text_preview || '';
      const stepN = step || 0;
      if (tools.length > 0) {
        addLine(`<span class="${isChild ? 'log-child' : ''}">${tag}<span class="log-step">step ${stepN}</span> → <span class="log-tool">${esc(toolStr)}</span></span>`);
      } else {
        addLine(`<span class="${isChild ? 'log-child' : ''}">${tag}<span class="log-step">step ${stepN}</span> → <span class="log-tool">(text)</span> <span class="log-paid">${esc(textPreview.substring(0, 100))}</span></span>`);
      }
      break;
    }

    case 'agent_llm_response': {
      const calls = data.tool_calls || [];
      const usage = data.usage || {};
      const uin = (usage.prompt_tokens || 0) - (usage.cached_tokens || 0);
      const uout = usage.completion_tokens || 0;
      const ucache = usage.cached_tokens || 0;
      const skipParams = new Set(['changes_only', 'before', 'after', 'line_numbers', 'ref', 'regex']);
      const toolSummary = calls.map(c => {
        const name = c.name;
        if (['spawn_agent', 'spawn_many', 'reflect', 'done'].includes(name)) return esc(name);
        try {
          const args = JSON.parse(c.arguments || '{}');
          const display = Object.entries(args).filter(([k]) => !skipParams.has(k));
          if (!display.length) return esc(name);
          let first = String(display[0][1]);
          if (first.includes('/') && first.length > 30) {
            const parts = first.split('/');
            first = '…/' + parts.slice(-2).join('/');
          } else if (first.length > 40) {
            first = first.substring(0, 40) + '…';
          }
          return `<span class="log-tool-name">${esc(name)}</span>(<span class="log-tool-args">${esc(first)}</span>)`;
        } catch(e) { return esc(name); }
      }).join(', ');
      const content = data.content || '';
      if (toolSummary) {
        addLine(`<span class="${isChild ? 'log-child' : ''}">${tag}${toolSummary} <span class="log-paid">↑${uin} ↓${uout}${ucache ? ' ©' + ucache : ''}</span></span>`);
      } else if (content) {
        addLine(`<span class="${isChild ? 'log-child' : ''}">${tag}<span class="log-paid">↑${uin} ↓${uout}</span> ${esc(content.substring(0, 120))}</span>`);
      }
      break;
    }

    case 'agent_reflect': {
      const conf = data.confidence || '?';
      const confCls = 'log-conf-' + conf;
      const childIndent = isChild ? 'log-child' : '';
      addLine(`<span class="${childIndent}">${tag}<span class="log-reflect">reflect</span> <span class="log-conf ${confCls}">${conf}</span></span>`);

      // Show resolved
      const resolved = data.resolved_questions || [];
      for (const rq of resolved) {
        const icon = rq.resolution === 'answered' ? '✓' : '✗';
        const cls = rq.resolution === 'answered' ? 'log-resolved-answered' : 'log-resolved-dropped';
        const qid = rq.id || rq.question || '?';
        const summary = (rq.summary || '').substring(0, 80);
        addLine(`<div class="log-resolved ${childIndent} ${cls}">${icon} ${esc(qid)} ${summary ? '→ ' + esc(summary) : ''}</div>`);
      }

      // Show open questions
      const questions = data.questions_remaining || [];
      for (const q of questions) {
        const qid = typeof q === 'object' ? (q.id || '?') : '?';
        const text = typeof q === 'object' ? (q.text || '') : String(q);
        addLine(`<div class="log-question ${childIndent}">● ${esc(qid)}: ${esc(text.substring(0, 70))}</div>`);
      }
      break;
    }

    case 'agent_done': {
      if (isChild) {
        addLine(`<span class="log-child-done">${tag}✓ done · ${ag?.steps || '?'} steps</span>`);
      } else {
        addLine('<div class="log-separator"></div>');
        addLine(`<span class="log-agent">${esc(aname)}</span> done · paid:${agents[aid]?.paid || 0}`);
      }
      break;
    }

    case 'agent_forced_done':
      addLine(`<span class="${isChild ? 'log-child' : ''}" style="color:#c69026">${tag}forced: ${esc(data.reason || 'limit')}</span>`);
      break;
  }
}

let autoScroll = true;
window.addEventListener('scroll', () => {
  const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 30;
  autoScroll = atBottom;
});

function addLine(html) {
  const div = document.createElement('div');
  div.className = 'log-line';
  div.innerHTML = html;
  log.appendChild(div);
  if (autoScroll) window.scrollTo(0, document.body.scrollHeight);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

connect();
</script>
</body>
</html>
