<!DOCTYPE html>
<html>
<head>
<title>DiffGraph Traces</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
body { padding: 20px; max-width: 1000px; margin: 0 auto; }
h1 { margin-bottom: 20px; }
.runs-table { width: 100%; border-collapse: collapse; }
.runs-table th, .runs-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #30363d; }
.runs-table th { color: #8b949e; font-size: 0.85em; font-weight: normal; }
.runs-table tr:hover { background: #161b22; }
.run-link { color: #58a6ff; text-decoration: none; }
.run-link:hover { text-decoration: underline; }
.status-completed { color: #56d364; }
.status-running { color: #c69026; }
.status-failed { color: #f47067; }
.empty { color: #8b949e; padding: 40px; text-align: center; }
.search { background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
          padding: 6px 12px; border-radius: 6px; width: 300px; margin-bottom: 16px;
          font-size: 0.9em; }
.search:focus { outline: none; border-color: #58a6ff; }
.prompt-gen { color: #d2a8ff; font-size: 0.85em; }
.new-row { animation: flash 1s; }
@keyframes flash { from { background: #1f6feb33; } to { background: transparent; } }
</style>
</head>
<body>
<h1>DiffGraph Traces</h1>

<div x-data="runsPanel()" x-init="startPolling()">
  <template x-if="runs.length > 0">
    <div>
      <input class="search" type="text" placeholder="Filter by run ID, model..." x-model="search">
      <table class="runs-table">
      <thead>
      <tr>
        <th>Run</th>
        <th>Started</th>
        <th>Model</th>
        <th>Prompts</th>
        <th>Status</th>
      </tr>
      </thead>
      <tbody>
      <template x-for="run in filtered()" :key="run.id">
        <tr :class="run._new ? 'new-row' : ''">
          <td><a class="run-link" :href="'{{ base_path }}/runs/' + run.id" x-text="run.id.substring(0, 12)"></a></td>
          <td x-text="(run.started_at || '?').substring(0, 19)"></td>
          <td x-text="run.model || '?'"></td>
          <td><span class="prompt-gen" x-text="formatPrompts(run)"></span></td>
          <td :class="'status-' + (run.status || 'unknown')" x-text="run.status || '?'"></td>
        </tr>
      </template>
      </tbody>
      </table>
    </div>
  </template>
  <template x-if="runs.length === 0">
    <div class="empty">No traces found. Run a review first.</div>
  </template>
</div>

<script>
function runsPanel() {
  return {
    runs: {{ runs | tojson }},
    search: '',
    _timer: null,
    filtered() {
      if (!this.search) return this.runs;
      const q = this.search.toLowerCase();
      return this.runs.filter(r => ((r.id || '') + ' ' + (r.model || '') + ' ' + formatPrompts(r)).toLowerCase().includes(q));
    },
    startPolling() {
      this._timer = setInterval(() => this.refresh(), 3000);
    },
    async refresh() {
      try {
        const resp = await fetch('{{ base_path }}/api/runs');
        const fresh = await resp.json();
        const knownIds = new Set(this.runs.map(r => r.id));
        // Mark new runs
        for (const r of fresh) {
          if (!knownIds.has(r.id)) r._new = true;
        }
        this.runs = fresh;
        // Clear _new flag after animation
        setTimeout(() => {
          for (const r of this.runs) r._new = false;
        }, 1200);
      } catch(e) {}
    },
    destroy() { if (this._timer) clearInterval(this._timer); },
  };
}

function formatPrompts(run) {
  const src = run.prompt_source || '';
  const hash = run.prompt_hash || '';
  if (!src) return '';
  // Extract generation name from URI: last meaningful segment
  let gen = src;
  if (src.includes('/')) {
    const parts = src.replace(/\/+$/, '').split('/');
    gen = parts[parts.length - 1];
    // If it's "prompts", go one level up
    if (gen === 'prompts' && parts.length > 1) gen = parts[parts.length - 2];
  }
  const hashPrefix = hash ? ` (${hash.substring(0, 3)})` : '';
  return gen + hashPrefix;
}
</script>
</body>
</html>
