<!DOCTYPE html>
<html>
<head>
<title>QA · Workers</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script>window.QA_BASE_PATH = "{{ base_path }}";</script>
<script defer src="{{ base_path }}/static/qa.js?v=fd003975"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.section { margin-top: 20px; padding: 12px; background: #161b22;
           border: 1px solid #30363d; border-radius: 6px; }
.section h2 { font-size: 0.95em; color: #c9d1d9; margin: 0 0 12px 0; font-weight: normal; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.muted { color: #8b949e; font-size: 0.85em; }
.empty { color: #8b949e; padding: 30px; text-align: center; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot-busy    { background: #c69026; box-shadow: 0 0 6px #c69026aa; }
.dot-idle    { background: #56d364; }
.dot-stopped { background: #58a6ff; }
.dot-dead    { background: #f47067; }
.btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
       padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
.btn:hover { background: #30363d; }
.task-link { color: #58a6ff; text-decoration: none;
             font-family: ui-monospace, monospace; }
.task-link:hover { text-decoration: underline; }
.tn { font-variant-numeric: tabular-nums; text-align: right; }
.tag-chip { display: inline-block; padding: 1px 6px; background: #21262d;
            color: #8b949e; border-radius: 3px; font-size: 0.75em; }
.refresh-meta { float: right; }
.form-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.form-row input, .form-row select {
  background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
  padding: 4px 8px; border-radius: 4px; font-size: 0.85em;
}
.btn-primary { background: #1f6feb; border-color: #388bfd; color: white; }
.btn-primary:hover { background: #388bfd; }
.btn-danger { background: #b62324; border-color: #da3633; color: white; }
.btn-danger:hover { background: #da3633; }
.section-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
</style>
</head>
<body hx-boost="true" hx-ext="head-support">
{% include "_qa_nav.html" %}

<h1>QA · Workers
  <span class="muted refresh-meta" x-data="{}" x-text="'· auto-refresh every 5s'"></span>
</h1>

<div x-data="workersView" x-init="load(); loadPools(); setInterval(() => { load(); loadPools(); }, 5000)">

  <!-- Pool config: server-side supervisor spawns workers per these rules -->
  <div class="section">
    <div class="section-row">
      <h2>pools <span class="muted" x-text="`(${pools.length})`"></span> ·
          <span class="muted">supervisor keeps target alive while queue has work for the provider</span></h2>
    </div>
    <template x-if="pools.length === 0">
      <div class="empty">no pools configured · workers must be started manually</div>
    </template>
    <template x-if="pools.length > 0">
      <table>
        <thead><tr>
          <th>id</th><th>name</th><th>provider</th>
          <th class="tn">target</th><th>trigger</th>
          <th class="tn">idle exit</th><th>state</th>
          <th>last check</th><th></th>
        </tr></thead>
        <tbody>
          <template x-for="p in pools" :key="p.id">
            <tr>
              <td x-text="`#${p.id}`"></td>
              <td x-text="p.name || '(unnamed)'"></td>
              <td x-text="p.provider"></td>
              <td class="tn" x-text="p.target_workers"></td>
              <td x-text="p.trigger"></td>
              <td class="tn" x-text="`${p.max_idle_seconds}s`"></td>
              <td>
                <span :class="p.enabled ? 'dot dot-idle' : 'dot dot-dead'"></span>
                <span x-text="p.enabled ? 'enabled' : 'disabled'"></span>
              </td>
              <td class="muted" x-text="(p.last_check_at ? fmtLocal(p.last_check_at) : 'never')"></td>
              <td>
                <button class="btn" @click="togglePool(p)" x-text="p.enabled ? 'disable' : 'enable'"></button>
                <button class="btn btn-danger" @click="deletePool(p.id)">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

    <div class="form-row" style="margin-top: 12px;">
      <input x-model="poolForm.name" placeholder="name (e.g. deepseek-default)" style="width: 200px;">
      <input x-model="poolForm.provider" placeholder="provider" style="width: 130px;">
      <span class="muted">target</span>
      <input type="number" x-model.number="poolForm.target_workers" min="1" style="width: 60px;">
      <span class="muted">idle exit (s)</span>
      <input type="number" x-model.number="poolForm.max_idle_seconds" style="width: 80px;">
      <span class="muted">task timeout (s)</span>
      <input type="number" x-model.number="poolForm.task_timeout_seconds"
             title="hard cap per bench subprocess; 900 = 15min" style="width: 80px;">
      <button class="btn-primary btn" @click="createPool()">add pool</button>
      <span class="muted" x-text="poolStatus"></span>
    </div>
  </div>


  <div class="section">
    <h2>fleet · <span x-text="`${workers.length} worker(s)`"></span>
        · <span x-text="`${busyCount} busy · ${idleCount} idle · ${deadCount} dead`"></span></h2>

    <template x-if="workers.length === 0">
      <div class="empty">no workers registered yet — start one with
        <code>quality-cli worker --provider=…</code>
      </div>
    </template>

    <template x-if="workers.length > 0">
      <table>
        <thead><tr>
          <th>state</th>
          <th>id</th>
          <th>provider</th>
          <th class="tn">capacity</th>
          <th>started</th>
          <th>last heartbeat</th>
          <th>current task</th>
        </tr></thead>
        <tbody>
          <template x-for="w in workers" :key="w.id">
            <tr>
              <td>
                <span class="dot" :class="dotClass(w)"></span>
                <span x-text="stateLabel(w)"></span>
              </td>
              <td style="font-family: ui-monospace, monospace;" x-text="w.id"></td>
              <td x-text="w.provider || '(any)'"></td>
              <td class="tn" x-text="w.capacity"></td>
              <td class="muted" x-text="fmtLocal(w.started_at)"></td>
              <td class="muted" x-text="heartbeatLabel(w)"></td>
              <td>
                <template x-if="w.current_task">
                  <span>
                    <a class="task-link"
                       :href="`{{ base_path }}/qa/sessions?task=${w.current_task.id}`"
                       :title="'show runs from this task'"
                       x-text="`task #${w.current_task.id}`"></a>
                    <span class="tag-chip" x-text="w.current_task.scenario_id"></span>
                    <span class="muted">state=<span x-text="w.current_task.state"></span> · plan=<a class="task-link"
                       :href="`{{ base_path }}/qa/sessions?plan=${w.current_task.plan_id}`"
                       x-text="w.current_task.plan_id || '-'"></a></span>
                  </span>
                </template>
                <template x-if="!w.current_task">
                  <span class="muted">— idle —</span>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </div>

  <!-- In-flight tasks at-a-glance -->
  <template x-if="leasedTasks.length > 0">
    <div class="section">
      <h2>in flight · <span x-text="`${leasedTasks.length} task(s)`"></span></h2>
      <table>
        <thead><tr>
          <th>task</th><th>scenario</th><th>provider</th><th>worker</th>
          <th>plan</th><th>started</th><th>lease ends</th>
        </tr></thead>
        <tbody>
          <template x-for="t in leasedTasks" :key="t.id">
            <tr>
              <td>
                <a class="task-link"
                   :href="`{{ base_path }}/qa/sessions?task=${t.id}`"
                   :title="'show runs from this task'"
                   x-text="`#${t.id}`"></a>
              </td>
              <td x-text="t.scenario_id"></td>
              <td x-text="t.provider"></td>
              <td style="font-family: ui-monospace, monospace;"
                  x-text="(t.lease_owner || '').slice(0,12)"></td>
              <td>
                <a class="task-link"
                   :href="`{{ base_path }}/qa/sessions?plan=${t.plan_id}`"
                   x-text="t.plan_id ? `#${t.plan_id}` : '-'"></a>
              </td>
              <td class="muted" x-text="fmtLocalTime(t.started_at)"></td>
              <td class="muted" x-text="fmtLocalTime(t.lease_expires_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>

</div>
</body>
</html>
