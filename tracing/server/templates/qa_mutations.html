<!DOCTYPE html>
<html>
<head>
<title>QA · Mutations</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script>window.QA_BASE_PATH = "{{ base_path }}";</script>
<script defer src="{{ base_path }}/static/qa.js?v=c4847817"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.section { margin-top: 20px; padding: 12px; background: #161b22;
           border: 1px solid #30363d; border-radius: 6px; }
.section h2 { font-size: 0.95em; color: #c9d1d9; margin: 0 0 12px 0; font-weight: normal; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.tn { font-variant-numeric: tabular-nums; text-align: right; }
.mut { color: #c9d1d9; font-family: ui-monospace, monospace; }
.gen { color: #d2a8ff; font-family: ui-monospace, monospace; }
.row-checkbox { cursor: pointer; }
.row-checkbox.selected { background: #1f6feb33; }
.empty { color: #8b949e; padding: 30px; text-align: center; }
.btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
       padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
.btn:hover { background: #30363d; }
.btn-primary { background: #1f6feb; border-color: #388bfd; color: white; }
.btn-primary:hover { background: #388bfd; }
.btn-primary:disabled { background: #1f2937; color: #6e7681; cursor: not-allowed; }
.compare-bar {
  position: sticky; top: 0; z-index: 10;
  background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
  padding: 10px; margin: 10px 0;
}
.compare-cells td { font-variant-numeric: tabular-nums; }
.delta-pos { color: #56d364; }
.delta-neg { color: #f47067; }
.delta-zero { color: #8b949e; }
.promote { color: #56d364; font-size: 0.75em; padding: 1px 6px;
           background: #56d36422; border-radius: 3px; }
.axis-bar { display: inline-block; width: 40px; height: 8px; vertical-align: middle;
            margin: 0 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
.axis-bar > div { height: 100%; }
.axis-good { background: #56d364; }
.axis-mid  { background: #c69026; }
.axis-bad  { background: #f47067; }
.axis-na   { color: #6e7681; font-size: 0.85em; }
.axes-grid { display: grid; grid-template-columns: 90px 80px 90px; gap: 4px 12px; font-size: 0.85em; }
.axes-grid .label { color: #8b949e; }
.pager { margin-top: 12px; display: flex; gap: 8px; align-items: center;
         font-size: 0.85em; color: #8b949e; }
.pager .btn-page { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
                   padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
.pager .btn-page:hover:not(:disabled) { background: #30363d; }
.pager .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body hx-boost="true" hx-ext="head-support">
{% include "_qa_nav.html" %}

<h1>QA · Mutations</h1>
<p style="color: #8b949e; font-size: 0.9em;">
  Each row is one prompt-content hash. Pick two to diff side-by-side.
  Promote-ready highlights mutations whose full plan finished cleanly.
</p>

<div x-data="mutationsView" x-init="load(); setInterval(() => load(), 10000)">

  <!-- Compare bar -->
  <div class="compare-bar" x-show="selected.length > 0">
    selected: <span class="mut" x-text="(selected[0] || '').slice(0,8)"></span>
    <template x-if="selected.length === 2">
      <span> · vs · <span class="mut" x-text="(selected[1] || '').slice(0,8)"></span></span>
    </template>
    <button class="btn-primary btn" :disabled="selected.length !== 2"
            @click="loadCompare()">compare</button>
    <button class="btn" @click="selected = []; comparison = null">clear</button>
  </div>

  <!-- Mutations list -->
  <div class="section">
    <h2>all mutations · pick two checkboxes to compare</h2>
    <div class="muted" style="margin-bottom:8px;" x-show="fireStatus" x-text="fireStatus"></div>
    <template x-if="mutations.length === 0">
      <div class="empty">no mutations yet</div>
    </template>
    <div class="pager" x-show="total > 0">
      <span x-text="rangeText"></span>
      <button class="btn-page" :disabled="page <= 1" @click="goPage(-1)">← prev</button>
      <span x-text="`page ${page} / ${pageCount}`"></span>
      <button class="btn-page" :disabled="page >= pageCount" @click="goPage(1)">next →</button>
    </div>
    <template x-if="mutations.length > 0">
      <table>
        <thead><tr>
          <th>pick</th><th>mutation</th><th>lineages</th>
          <th class="tn">runs</th>
          <th>hard</th><th>soft</th><th>method</th>
          <th class="tn">pass%</th>
          <th class="tn">avg dur ms</th>
          <th>last activity</th>
          <th></th>
        </tr></thead>
        <tbody>
          <template x-for="m in mutations" :key="m.mutation">
            <tr :class="selected.includes(m.mutation) ? 'row-checkbox selected' : 'row-checkbox'"
                @click="toggleSelect(m.mutation)">
              <td>
                <input type="checkbox" :checked="selected.includes(m.mutation)"
                       @click.stop="toggleSelect(m.mutation)">
              </td>
              <td>
                <a class="mut run-link" :href="`{{ base_path }}/qa/runs?mutation=${m.mutation}`"
                   x-text="m.mutation"></a>
              </td>
              <td x-text="m.lineages || '—'" :title="m.full_sha || ''"></td>
              <td class="tn" x-text="m.runs"></td>
              <td><span x-html="axisBar(scoring[m.mutation], 'hard_skill')"></span></td>
              <td><span x-html="axisBar(scoring[m.mutation], 'soft_skill')"></span></td>
              <td><span x-html="axisBar(scoring[m.mutation], 'methodology')"></span></td>
              <td class="tn" x-text="passRate(scoring[m.mutation])"></td>
              <td class="tn" x-text="Math.round(m.avg_duration_ms || 0)"></td>
              <td style="color:#8b949e;"
                  x-text="fmtLocal(m.last_seen || m.last_planned)"></td>
              <td>
                <template x-if="onDemandConfigs.length > 0">
                  <span @click.stop>
                    <select :id="`fire-${m.mutation}`"
                            style="background:#0d1117; border:1px solid #30363d;
                                   color:#c9d1d9; padding:3px 6px; border-radius:3px;
                                   font-size:0.8em;">
                      <template x-for="cfg in onDemandConfigs" :key="cfg.id">
                        <option :value="cfg.id" x-text="cfg.name || `config #${cfg.id}`"></option>
                      </template>
                    </select>
                    <button class="btn"
                            @click.stop="fireSchedule(m.mutation, $event)">▶ fire</button>
                  </span>
                </template>
                <template x-if="onDemandConfigs.length === 0">
                  <span class="muted" style="font-size:0.75em;">no on_demand schedules</span>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </div>

  <!-- Engineering-assessment axes side-by-side -->
  <template x-if="scoringCompare">
    <div class="section">
      <h2>assessment axes ·
        <span class="mut" x-text="(scoringCompare.a.mutation || '').slice(0,8)"></span>
        vs
        <span class="mut" x-text="(scoringCompare.b.mutation || '').slice(0,8)"></span>
      </h2>
      <table class="compare-cells">
        <thead><tr>
          <th>axis</th><th>A</th><th>B</th><th>Δ</th>
        </tr></thead>
        <tbody>
          <template x-for="ax in ['hard_skill','soft_skill','methodology']" :key="ax">
            <tr>
              <td x-text="ax.replace('_', ' ')"></td>
              <td x-html="axisBar(scoringCompare.a, ax)"></td>
              <td x-html="axisBar(scoringCompare.b, ax)"></td>
              <td class="tn" :class="axisDeltaClass(ax)" x-text="axisDelta(ax)"></td>
            </tr>
          </template>
          <tr>
            <td>pass rate</td>
            <td class="tn" x-text="passRate(scoringCompare.a)"></td>
            <td class="tn" x-text="passRate(scoringCompare.b)"></td>
            <td></td>
          </tr>
          <tr>
            <td>warnings/run</td>
            <td class="tn" x-text="(scoringCompare.a.overall.warnings_per_run ?? 0).toFixed(2)"></td>
            <td class="tn" x-text="(scoringCompare.b.overall.warnings_per_run ?? 0).toFixed(2)"></td>
            <td></td>
          </tr>
          <tr>
            <td>false positives/run</td>
            <td class="tn" x-text="(scoringCompare.a.overall.fp_per_run ?? 0).toFixed(2)"></td>
            <td class="tn" x-text="(scoringCompare.b.overall.fp_per_run ?? 0).toFixed(2)"></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>

  <!-- Comparison cells (per-scenario × provider) -->
  <template x-if="comparison">
    <div class="section">
      <h2>per (scenario × provider) ·
        <span class="mut" x-text="(comparison.a.mutation || '').slice(0,8)"></span>
        →
        <span class="mut" x-text="(comparison.b.mutation || '').slice(0,8)"></span>
      </h2>
      <table class="compare-cells">
        <thead><tr>
          <th>scenario</th><th>provider</th>
          <th class="tn">A runs</th><th class="tn">B runs</th>
          <th class="tn">A avg ms</th><th class="tn">B avg ms</th>
          <th class="tn">Δ ms</th>
          <th class="tn">A done</th><th class="tn">B done</th>
        </tr></thead>
        <tbody>
          <template x-for="cell in comparison.cells" :key="`${cell.scenario}|${cell.provider}`">
            <tr>
              <td x-text="cell.scenario"></td>
              <td x-text="cell.provider"></td>
              <td class="tn" x-text="cell.a_runs || 0"></td>
              <td class="tn" x-text="cell.b_runs || 0"></td>
              <td class="tn" x-text="Math.round(cell.a_avg_dur || 0)"></td>
              <td class="tn" x-text="Math.round(cell.b_avg_dur || 0)"></td>
              <td class="tn"
                  :class="deltaClass(cell.a_avg_dur, cell.b_avg_dur)"
                  x-text="deltaText(cell.a_avg_dur, cell.b_avg_dur)"></td>
              <td class="tn" x-text="cell.a_completed || 0"></td>
              <td class="tn" x-text="cell.b_completed || 0"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>

</div>


</body>
</html>
