<!DOCTYPE html>
<html>
<head>
<title>QA · Sessions</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script>window.QA_BASE_PATH = "{{ base_path }}";</script>
<script defer src="{{ base_path }}/static/qa.js?v=fd003965"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.filter-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px; margin: 12px 0; padding: 12px; background: #161b22;
  border: 1px solid #30363d; border-radius: 6px;
}
.filter-grid label { display: flex; flex-direction: column; font-size: 0.8em; color: #8b949e; }
.filter-grid input, .filter-grid select {
  background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
  padding: 4px 8px; border-radius: 4px; font-size: 0.9em;
}
.filter-grid input:focus, .filter-grid select:focus,
.filter-grid .multi:focus-within { outline: none; border-color: #58a6ff; }
.multi {
  background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
  padding: 3px; min-height: 26px; display: flex; flex-wrap: wrap; gap: 3px;
  align-items: center;
}
.multi .chip {
  background: #1f6feb33; color: #58a6ff; padding: 2px 6px;
  border-radius: 3px; font-size: 0.8em; cursor: pointer;
}
.multi .chip::after { content: " ×"; opacity: 0.6; }
.multi select {
  border: 0; background: transparent; flex: 1; min-width: 80px;
  font-size: 0.85em; padding: 2px;
}
/* Wrap the wide table so horizontal scroll lives INSIDE this box —
 * without this, ~20 columns push the page body wider than the
 * viewport and create a horizontal scrollbar on <body>. The table
 * itself keeps `width: 100%` so the layout is fluid; only the
 * scroll wrapper is bounded to the parent. */
.sessions-table-scroll { overflow-x: auto; max-width: 100%; }
.sessions-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
.sessions-table th, .sessions-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #30363d; }
.sessions-table th { color: #8b949e; font-weight: normal; cursor: pointer; }
.sessions-table tr:hover { background: #161b22; }
.run-link { color: #58a6ff; text-decoration: none; font-family: ui-monospace, monospace; }
.run-link:hover { text-decoration: underline; }
.status-completed { color: #56d364; }
.status-failed    { color: #f85149; font-weight: bold; }
.status-running   { color: #d29922; }
tr.row-failed     { background: #ff000010; }
tr.row-running    { background: #d2992211; }
.tag-chip { display: inline-block; padding: 1px 6px; margin: 1px; background: #21262d;
            color: #8b949e; border-radius: 3px; font-size: 0.75em; }
.summary-cell { white-space: nowrap; }
.summary-chip { display: inline-block; padding: 1px 5px; margin: 0 2px 0 0;
                background: #1f242c; color: #8b949e; border-radius: 3px;
                font-size: 0.75em; font-family: ui-monospace, monospace; }
.token-chip { background: #1f2a1f; color: #7ee787; }
.linked-chip { display: inline-block; padding: 1px 6px; background: #d2a8ff22;
               color: #d2a8ff; border-radius: 3px; font-size: 0.75em;
               font-family: ui-monospace, monospace; text-decoration: none; }
.linked-chip:hover { background: #d2a8ff44; }
.meta { color: #8b949e; font-size: 0.85em; margin-bottom: 8px; }
.empty { color: #8b949e; padding: 40px; text-align: center; }
.btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
       padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
.btn:hover { background: #30363d; }
.btn-primary { background: #1f6feb; border-color: #388bfd; color: white; }
.btn-primary:hover { background: #388bfd; }
.dur-cell { font-variant-numeric: tabular-nums; text-align: right; }
</style>
</head>
<body hx-boost="true" hx-ext="head-support">
{% include "_qa_nav.html" %}

<h1>QA · Sessions</h1>

<div x-data="sessionsView" x-init="init(); setInterval(() => search(true), 5000)">
  <div class="filter-grid">
    <label>agent
      <select x-model="filters.agent" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.agent_name"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>model
      <select x-model="filters.model" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.model"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>scenario
      <select x-model="filters.scenario" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.scenario_id"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>generation
      <select x-model="filters.generation" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.generation"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>project
      <select x-model="filters.project" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.project"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>status
      <select x-model="filters.status" @change="search()">
        <option value="">any</option>
        <template x-for="v in dims.status"><option :value="v" x-text="v"></option></template>
      </select>
    </label>

    <label>mutation (prefix)
      <input x-model.lazy="filters.mutation" placeholder="hash..." @change="search()">
    </label>

    <label>plan
      <input type="number" x-model.lazy.number="filters.plan"
             placeholder="13" @change="search()" style="width: 70px;">
    </label>

    <!-- Multi-selects: scenario_tag -->
    <label>scenario_tag
      <div class="multi">
        <template x-for="t in filters.scenario_tag_arr" :key="t">
          <span class="chip" x-text="t" @click="filters.scenario_tag_arr = filters.scenario_tag_arr.filter(x => x !== t); search();"></span>
        </template>
        <select @change="addToList('scenario_tag_arr', $event.target.value); $event.target.value=''">
          <option value="">+ add</option>
          <template x-for="v in dims.scenario_tags">
            <option :value="v" x-text="v" :disabled="filters.scenario_tag_arr.includes(v)"></option>
          </template>
        </select>
      </div>
    </label>

    <label>file (path in files_touched)
      <input x-model.lazy="filters.file" placeholder="src/Foo.java" @change="search()">
    </label>

    <label>jira
      <input x-model.lazy="filters.jira" placeholder="ORD-234" @change="search()">
    </label>

    <label>min duration (ms)
      <input type="number" x-model.lazy.number="filters.duration_gt_ms" placeholder="60000" @change="search()">
    </label>

    <label title="Time window for the trace search. Empty + no other narrowing filter = default last 24h (Jaeger convention). Shorter windows are much faster against the events table.">
      window
      <select x-model="filters.window" @change="search()">
        <option value="1h">last 1h</option>
        <option value="6h">last 6h</option>
        <option value="24h" selected>last 24h</option>
        <option value="7d">last 7d</option>
        <option value="30d">last 30d</option>
        <option value="">all time (slow)</option>
      </select>
    </label>

    <label>limit
      <select x-model.number="filters.limit" @change="search()">
        <option>10</option><option>20</option><option selected>50</option>
        <option>100</option><option>200</option>
      </select>
    </label>
  </div>

  <div style="margin: 8px 0;">
    <button class="btn-primary btn" @click="search()">search</button>
    <button class="btn" @click="reset()">reset</button>
    <span class="meta" style="margin-left: 12px;" x-text="meta"></span>
  </div>

  <template x-if="rows.length === 0">
    <div class="empty">no runs match — try dropping filters</div>
  </template>

  <template x-if="rows.length > 0">
    <div class="sessions-table-scroll">
    <table class="sessions-table">
      <thead>
        <tr>
          <th>status</th>
          <th>session</th>
          <th>scen_run</th>
          <th>agent_id</th>
          <th>agent</th>
          <th>scenario</th>
          <th>model</th>
          <th>generation</th>
          <th>mutation</th>
          <th>plan</th>
          <th>task</th>
          <th class="dur-cell">dur ms</th>
          <th>summary</th>
          <th>tags</th>
          <th>started</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in rows" :key="`${r.session_id || r.id}|${r.agent_id || ''}`">
          <tr :class="`row-${r.status || ''}`">
            <td>
              <span :class="`status-${r.status || ''}`"
                    :title="r.error_message || r.status || ''"
                    x-text="r.status === 'failed' ? '✗ failed' : (r.status === 'running' ? '⟳ running' : '✓')"></span>
              <template x-if="r.status === 'failed' && (r.span_id || r.trace_id)">
                <a class="run-link" style="margin-left:6px;font-size:0.8em;"
                   :href="sessionHref(r)"
                   :title="r.error_message || 'open span detail (request/response/exception)'"
                   x-text="'response →'"></a>
              </template>
            </td>
            <td>
              <a class="run-link"
                 :href="`{{ base_path }}/qa/sessions?session=${r.session_id || r.id}`"
                 :title="'show all sub-agents of this session'"
                 x-text="(r.session_id || r.id || '').slice(0,12)"></a>
            </td>
            <td>
              <template x-if="r.scenario_run_id">
                <a class="run-link"
                   :href="`{{ base_path }}/qa/sessions?scenario_run=${r.scenario_run_id}`"
                   :title="'show the agent + judge for this attempt (= one scenario × repeat in a plan)'"
                   x-text="(r.scenario_run_id || '').slice(0,8)"></a>
              </template>
            </td>
            <td>
              <a class="run-link"
                 :href="sessionHref(r)"
                 :title="'open per-step trace for this agent'"
                 x-text="(r.agent_id || '').slice(0,8) || '—'"></a>
            </td>
            <td x-text="r.agent_name || ''"></td>
            <td x-text="r.scenario_id || ''"></td>
            <td x-text="(r.model || '').slice(0,28)" :title="r.model"></td>
            <td x-text="r.generation || ''" style="color: #d2a8ff;"></td>
            <td style="font-family: ui-monospace, monospace;" x-text="(r.mutation || '').slice(0,8)"></td>
            <td>
              <template x-if="r.plan_id">
                <a class="run-link"
                   :href="`{{ base_path }}/qa/sessions?plan=${r.plan_id}`"
                   x-text="`#${r.plan_id}`"
                   :title="'show all runs from this plan'"></a>
              </template>
            </td>
            <td>
              <template x-if="r.task_id">
                <a class="run-link"
                   :href="`{{ base_path }}/qa/sessions?task=${r.task_id}`"
                   x-text="`#${r.task_id}`"
                   :title="'show all runs from this task'"></a>
              </template>
            </td>
            <td class="dur-cell" x-text="r.duration_ms || ''"></td>
            <td class="summary-cell">
              <template x-if="r.llm_count">
                <span class="summary-chip" :title="'LLM calls'"
                      x-text="`llm:${r.llm_count}`"></span>
              </template>
              <template x-if="r.step_count">
                <span class="summary-chip" :title="'ReAct steps'"
                      x-text="`steps:${r.step_count}`"></span>
              </template>
              <template x-if="r.tool_count">
                <span class="summary-chip" :title="'tool calls'"
                      x-text="`tools:${r.tool_count}`"></span>
              </template>
              <template x-if="r.tokens_in">
                <span class="summary-chip token-chip"
                      :title="`prompt tokens (cached: ${r.tokens_cached || 0})`"
                      x-text="`in:${(r.tokens_in_uncached || r.tokens_in)}${r.tokens_cached ? '+'+r.tokens_cached+'c' : ''}`"></span>
              </template>
              <template x-if="r.tokens_out">
                <span class="summary-chip token-chip" :title="'completion tokens'"
                      x-text="`out:${r.tokens_out}`"></span>
              </template>
            </td>
            <td>
              <template x-for="t in (r.scenario_tags || []).slice(0, 3)">
                <span class="tag-chip" x-text="t"></span>
              </template>
            </td>
            <td class="meta" x-text="fmtLocal(r.started_at)"></td>
          </tr>
        </template>
      </tbody>
    </table>
    </div>
  </template>

  <div style="margin-top: 12px;">
    <button class="btn" :disabled="filters.offset === 0"
            @click="filters.offset = Math.max(0, filters.offset - filters.limit); search()">prev</button>
    <button class="btn" :disabled="!hasMore"
            @click="filters.offset += filters.limit; search()">next</button>
    <span class="meta" style="margin-left: 12px;"
          x-text="`offset=${filters.offset} · returned=${rows.length} · total=${total}`"></span>
  </div>
</div>


</body>
</html>
