<!DOCTYPE html>
<html>
<head>
<title>QA · Auto-plan</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{{ base_path }}/static/trace.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
body { padding: 20px; max-width: 1400px; margin: 0 auto; }
.qa-nav { margin-bottom: 16px; font-size: 0.9em; }
.qa-nav a { color: #58a6ff; margin-right: 12px; text-decoration: none; }
.qa-nav a:hover { text-decoration: underline; }
.section { margin-top: 20px; padding: 12px; background: #161b22;
           border: 1px solid #30363d; border-radius: 6px; }
.section h2 { font-size: 0.95em; color: #c9d1d9; margin: 0 0 12px 0; font-weight: normal; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #30363d; }
th { color: #8b949e; font-weight: normal; }
.btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
       padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
.btn:hover { background: #30363d; }
.btn-primary { background: #1f6feb; border-color: #388bfd; color: white; }
.btn-primary:hover { background: #388bfd; }
.btn-danger { background: #b62324; border-color: #da3633; color: white; }
.btn-danger:hover { background: #da3633; }
.form-grid { display: grid; grid-template-columns: 200px 1fr; gap: 8px 14px;
             align-items: center; max-width: 700px; }
.form-grid label { color: #8b949e; font-size: 0.85em; }
.form-grid input, .form-grid select, .form-grid textarea {
  background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
  padding: 5px 9px; border-radius: 4px; font-size: 0.9em; width: 100%;
  font-family: inherit;
}
.muted { color: #8b949e; font-size: 0.85em; }
.empty { color: #8b949e; padding: 30px; text-align: center; }
.bulb-on { color: #56d364; }
.bulb-off { color: #6e7681; }
.created-list { max-height: 400px; overflow-y: auto; }
.kind-unit { color: #58a6ff; }
.kind-full { color: #d2a8ff; }
</style>
</head>
<body>
<div class="qa-nav">
  <a href="{{ base_path }}/qa/">overview</a>
  <a href="{{ base_path }}/qa/runs">runs</a>
  <a href="{{ base_path }}/qa/plans">plans</a>
  <a href="{{ base_path }}/qa/genes">genes</a>
  <a href="{{ base_path }}/qa/auto-plan"><b>auto-plan</b></a>
  <a href="{{ base_path }}/">traces</a>
</div>

<h1>QA · Auto-plan</h1>
<p class="muted">
Watch git branches; on each new commit auto-create QA plans.
Idempotent: same (branch, sha) is never planned twice.
</p>

<div x-data="autoPlan()" x-init="load()">

  <!-- Configs list -->
  <div class="section">
    <h2>configs</h2>
    <template x-if="configs.length === 0">
      <div class="empty">no configs yet — fill the form below</div>
    </template>
    <template x-if="configs.length > 0">
      <table>
        <thead><tr>
          <th>id</th><th>name</th><th>repo</th><th>branches</th>
          <th>unit / full</th><th>providers</th>
          <th>state</th><th>last discover</th><th></th>
        </tr></thead>
        <tbody>
          <template x-for="c in configs" :key="c.id">
            <tr>
              <td x-text="`#${c.id}`"></td>
              <td x-text="c.name || '(unnamed)'"></td>
              <td class="muted" :title="c.repo_path" x-text="c.repo_path.slice(-32)"></td>
              <td x-text="c.branch_pattern"></td>
              <td>
                <span class="kind-unit" x-text="c.unit_scenarios.length"></span>
                /
                <span class="kind-full" x-text="c.full_scenarios.length"></span>
              </td>
              <td x-text="c.providers.join(', ')"></td>
              <td>
                <span :class="c.enabled ? 'bulb-on' : 'bulb-off'"
                      x-text="c.enabled ? '● enabled' : '○ disabled'"></span>
              </td>
              <td class="muted" x-text="(c.last_discover_at || '').slice(0, 19)"></td>
              <td>
                <button class="btn" @click="toggle(c)" x-text="c.enabled ? 'disable' : 'enable'"></button>
                <button class="btn btn-danger" @click="del(c.id)">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

    <div style="margin-top: 12px;">
      <button class="btn-primary btn" @click="discoverAll()">discover now</button>
      <span class="muted" style="margin-left: 12px;" x-text="discoverStatus"></span>
    </div>
  </div>

  <!-- Recently created plans (last discover sweep) -->
  <template x-if="lastCreated.length > 0">
    <div class="section">
      <h2>just planned <span class="muted" x-text="`(${lastCreated.length})`"></span></h2>
      <div class="created-list">
        <table>
          <thead><tr>
            <th>plan</th><th>kind</th><th>branch</th><th>sha</th><th>tasks</th>
          </tr></thead>
          <tbody>
            <template x-for="p in lastCreated" :key="`${p.plan_id}-${p.plan_kind}`">
              <tr>
                <td><a class="run-link" :href="`{{ base_path }}/qa/plans`" x-text="`#${p.plan_id}`"></a></td>
                <td><span :class="`kind-${p.plan_kind}`" x-text="p.plan_kind"></span></td>
                <td x-text="p.branch"></td>
                <td style="font-family: ui-monospace, monospace;" x-text="p.sha.slice(0, 7)"></td>
                <td x-text="p.task_count"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Add new config -->
  <div class="section">
    <h2>add config</h2>
    <div class="form-grid">
      <label>name</label>
      <input x-model="form.name" placeholder="diff-graph">

      <label>repo path</label>
      <input x-model="form.repo_path" placeholder="/home/andrey/repos/diff-graph">

      <label>branch pattern</label>
      <input x-model="form.branch_pattern" placeholder="master,feature/*">

      <label>providers (CSV)</label>
      <input x-model="form.providers" placeholder="deepseek,qwen3-6">

      <label>unit scenarios (every commit)</label>
      <input x-model="form.unit_scenarios" placeholder="DISP-002,INV-001">

      <label>full scenarios (periodic)</label>
      <input x-model="form.full_scenarios" placeholder="DISP-001,DISP-002,INV-001,REV-001,REV-002">

      <label>full period (s)</label>
      <input type="number" x-model.number="form.full_period_seconds">

      <label>attempts_min</label>
      <input type="number" x-model.number="form.attempts_min">
    </div>
    <div style="margin-top: 12px;">
      <button class="btn-primary btn" @click="create()">create</button>
      <span class="muted" style="margin-left: 12px;" x-text="createStatus"></span>
    </div>
  </div>

</div>

<script>
function autoPlan() {
  return {
    configs: [],
    lastCreated: [],
    discoverStatus: '',
    createStatus: '',
    form: {
      name: '',
      repo_path: '/home/andrey/repos/diff-graph',
      branch_pattern: 'master,feature/*',
      providers: 'deepseek',
      unit_scenarios: 'DISP-002,INV-001',
      full_scenarios: 'DISP-001,DISP-002,INV-001,REV-001,REV-002',
      full_period_seconds: 86400,
      attempts_min: 1,
    },
    async load() {
      const r = await fetch(`{{ base_path }}/api/qa/auto-plan/configs`);
      this.configs = (await r.json()).data || [];
    },
    async discoverAll() {
      this.discoverStatus = 'discovering...';
      const r = await fetch(`{{ base_path }}/api/qa/auto-plan/discover`, {method: 'POST'});
      const j = await r.json();
      this.lastCreated = j.data || [];
      this.discoverStatus = `created ${(j.meta && j.meta.created_count) || 0} plan(s)`;
      await this.load();
    },
    async toggle(c) {
      const url = `{{ base_path }}/api/qa/auto-plan/configs/${c.id}?enabled=${!c.enabled}`;
      await fetch(url, {method: 'PATCH'});
      await this.load();
    },
    async del(id) {
      if (!confirm(`delete config #${id}?`)) return;
      await fetch(`{{ base_path }}/api/qa/auto-plan/configs/${id}`, {method: 'DELETE'});
      await this.load();
    },
    async create() {
      this.createStatus = 'creating...';
      const csv = (s) => s.split(',').map(x => x.trim()).filter(Boolean);
      const payload = {
        name: this.form.name,
        repo_path: this.form.repo_path,
        branch_pattern: this.form.branch_pattern,
        providers: csv(this.form.providers),
        unit_scenarios: csv(this.form.unit_scenarios),
        full_scenarios: csv(this.form.full_scenarios),
        full_period_seconds: this.form.full_period_seconds,
        attempts_min: this.form.attempts_min,
        enabled: true,
      };
      const r = await fetch(`{{ base_path }}/api/qa/auto-plan/configs`, {
        method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify(payload),
      });
      if (r.ok) {
        this.createStatus = 'created';
        await this.load();
      } else {
        const err = await r.json();
        this.createStatus = `error: ${(err.error && err.error.message) || r.status}`;
      }
    },
  };
}
</script>
</body>
</html>
