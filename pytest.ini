[pytest]
# Repo-root pytest config for the merged tree (engine + benchmarks/).
#
# import-mode=importlib: each test file is imported under a unique
# synthesized name, so the engine's top-level `tests/` (no __init__.py)
# and the bench's `benchmarks/tests/` (has __init__.py) no longer
# collide on the bare package name `tests`. This is the modern
# recommended mode and removes all the __init__.py-placement guessing.
#
# testpaths: every test dir in the merged tree, listed explicitly so a
# bare `pytest` from the repo root runs the whole suite in one command.
#
# asyncio_mode=auto: carried over from the old benchmarks/pytest.ini —
# the bench runner tests use `async def test_*` without per-test
# decorators. Harmless to the engine's synchronous tests.
#
# sys.path wiring for the bench tests (which do `from runner.X import`)
# lives in the repo-root conftest.py.
addopts = --import-mode=importlib
asyncio_mode = auto
testpaths =
    tests
    tracing/tests
    diffsearch/tests
    evolution/tests
    webhook/tests
    benchmarks/tests
