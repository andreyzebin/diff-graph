# Centralised messages for budget pushers and reflect guards.
# Edit here to tune wording across the budget-pressure surface
# without touching code. Loaded by `orchestra/messages.py` at import.
#
# Placeholders in `{name}` form are filled at apply time via
# `str.format(**kwargs)`:
#   - reflect.cadence.nudge: {threshold}  → the cadence interval
#
# Style guide (see docs/orchestra-architecture.md §Tool-result
# convention): pusher messages REPORT STATE plainly. They MUST NOT
# prescribe what the agent should do about it ("prefer agent_spawn",
# "wrap up now", "consolidate") — that's the prompt's job. Token /
# step / time pushers historically use slightly more prescriptive
# wording because their FORCE_DONE handler narrows tools to `done()`
# regardless; the messages are companions to a hard intervention.
# Context-axis is NUDGE-only and stays purely informational.

budget:
  # Three-level escalation for every axis with a hard cap (token,
  # wall_time, step): NUDGE @ 0.5 → NUDGE_HIGH @ 0.75 → FORCE_DONE
  # @ 1.0 (or 0.90 for step). NUDGE_HIGH is the mandatory warning
  # before tool surface narrows — closes the gap between "halfway"
  # and the terminal cap so the agent has explicit notice that
  # FORCE_DONE is imminent. Context axis is NUDGE-only with the
  # same two NUDGE levels (no FORCE_DONE by design).
  token:
    nudge: >-
      Half of your token budget is used. Plan what's left so you
      finish before it runs out.
    nudge_high: >-
      Most of your token budget is used — wrap up soon, FORCE_DONE
      is close.
    force_done: Token budget exhausted. Submit your final output now.

  wall_time:
    nudge: >-
      Half of your wall-clock budget is used. Plan what's left so
      you finish before it runs out.
    nudge_high: >-
      Most of your wall-clock budget is used — wrap up soon,
      FORCE_DONE is close.
    force_done: Wall-clock budget exhausted. Submit your final output now.

  steps:
    nudge: >-
      Half of your step budget is used. Plan what's left so you
      finish before it runs out.
    nudge_high: >-
      Most of your step budget is used — wrap up soon, FORCE_DONE
      is close.
    force_done: Step budget running low. Submit your final output now.

  context:
    # NUDGE-only axis. No `force_done` key — context-pressure remedy
    # is agent-specific (spawn / condense / wrap up), so the pusher
    # just reports state and leaves the response to each agent's
    # prompt.
    nudge: Conversation history fills 50% of this agent's LLM context window.
    nudge_high: Conversation history fills 75% of this agent's LLM context window.

budget_stats:
  # Hardcoded rough estimates used by the `budget_stats` tool when
  # surfacing what a typical investigator spawn costs. Phase 1 — these
  # are guesses, not measurements. Tune from observed traces, or
  # replace once §11 (repo memory) / §12 (per-bucket stats) lands and
  # we have real measured medians per repo/agent/model bucket.
  #
  # Compact-form values feed the table-with-bars template — they're
  # bare numeric ranges (no prose), inlined as "spawn: ~{carved}
  # tokens + ~{carved_steps} steps → ~{return} back".
  typical_spawn:
    spawn_carved: 20-30K
    spawn_carved_steps: 10-20
    spawn_return: 3-5K

reflect:
  cadence:
    # Step-cadence reflect nudge. `{threshold}` = configured interval.
    nudge: >-
      You've taken {threshold:.0f} steps without calling reflect().
      Pause and call reflect(confidence=…, learned=…,
      questions_remaining=[…]) — consolidate what you've learned,
      what's still open, and what's resolved. Then continue.
