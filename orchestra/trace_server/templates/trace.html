{% from "macros.html" import agent as _agent, llm_call, sgr_entry, findings %}
<!DOCTYPE html>
<html>
<head>
<title>Trace · {{ title }}</title>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/trace.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div class="layout" x-data="splitPane()">
  <div class="left-pane" :style="'width:' + leftWidth + 'px'">
    <h1><a href="/" style="color:#8b949e;text-decoration:none">←</a> Trace · {{ title }}</h1>
    {{ _agent(trace, run_id) }}
  </div>
  <div class="divider" @mousedown="startDrag($event)"></div>
  <div class="right-pane" x-data="tabPanel()">
    <div class="tab-bar">
      <template x-if="tabs.length === 0">
        <span class="tab-hint">Click [⧉] to open details</span>
      </template>
      <template x-for="tab in tabs" :key="tab.id">
        <div class="tab-btn" :class="{ active: active === tab.id }" @click="active = tab.id">
          <span x-text="tab.title.substring(0, 30)"></span>
          <span class="tab-close" @click.stop="closeTab(tab.id)">×</span>
        </div>
      </template>
    </div>
    <div class="tab-content">
      <template x-if="active && getTab(active)">
        <div style="display:flex;flex-direction:column;height:100%">
          <template x-if="getTab(active).loading">
            <span style="color:#8b949e">Loading…</span>
          </template>
          <template x-if="!getTab(active).loading">
            <div style="display:flex;flex-direction:column;height:100%">
              <div class="tab-toolbar">
                <button class="toolbar-btn" @click="copyContent(getTab(active))">📋 Copy</button>
                <button class="toolbar-btn" :class="{ active: getTab(active).jsonMode }"
                        :disabled="!getTab(active).rawJson"
                        @click="toggleJson(getTab(active))">{ } JSON</button>
              </div>
              <pre class="tab-pre" x-text="displayContent(getTab(active))"></pre>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
function splitPane() {
  return {
    leftWidth: Math.floor(window.innerWidth * 0.5),
    startDrag(e) {
      const self = this;
      const onMove = (ev) => { self.leftWidth = Math.max(200, Math.min(window.innerWidth - 204, ev.clientX)); };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.body.style.cursor = ''; document.body.style.userSelect = ''; };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    }
  };
}

function tabPanel() {
  return {
    tabs: [],
    active: null,
    openTab(id, title, content, rawJson) {
      if (this.tabs.find(t => t.id === id)) { this.active = id; return; }
      this.tabs.push({ id, title, content, rawJson: rawJson || null, jsonMode: false, loading: false });
      this.active = id;
    },
    closeTab(id) {
      this.tabs = this.tabs.filter(t => t.id !== id);
      if (this.active === id) this.active = this.tabs.length ? this.tabs[this.tabs.length-1].id : null;
    },
    getTab(id) { return this.tabs.find(t => t.id === id); },
    toggleJson(tab) {
      if (!tab.rawJson) return;
      tab.jsonMode = !tab.jsonMode;
    },
    displayContent(tab) {
      return tab.jsonMode && tab.rawJson ? tab.rawJson : tab.content;
    },
    async copyContent(tab) {
      try {
        await navigator.clipboard.writeText(this.displayContent(tab));
        showToast('✓ Copied');
      } catch(e) { showToast('Error: ' + e.message); }
    },
  };
}

// Fetch full data from API and open in tab
async function fetchTab(title, url, msgIndex) {
  const panel = document.querySelector('[x-data="tabPanel()"]');
  if (!panel) return;
  const data = Alpine.$data(panel);
  const id = url + (msgIndex !== undefined ? '#' + msgIndex : '');
  data.openTab(id, title, 'Loading…');
  try {
    const resp = await fetch(url);
    const raw = await resp.text();
    let content = raw;
    let rawJson = null;
    if (msgIndex !== undefined) {
      try {
        const msgs = JSON.parse(raw);
        if (Array.isArray(msgs) && msgs[msgIndex]) {
          const msg = msgs[msgIndex];
          rawJson = JSON.stringify(msg, null, 2);
          content = typeof msg.content === 'string' && msg.content
            ? msg.content
            : rawJson;
        }
      } catch(e) {}
    } else {
      try {
        const parsed = JSON.parse(raw);
        rawJson = JSON.stringify(parsed, null, 2);
        // Tool calls array: extract and pretty-print arguments
        if (Array.isArray(parsed) && parsed.length && parsed[0].arguments !== undefined) {
          const parts = parsed.map(tc => {
            try { return JSON.stringify(JSON.parse(tc.arguments), null, 2); } catch(e) { return tc.arguments; }
          });
          content = parts.join('\n\n---\n\n');
        } else {
          content = rawJson;
        }
      } catch(e) {}
    }
    const tab = data.tabs.find(t => t.id === id);
    if (tab) {
      tab.content = content;
      tab.rawJson = rawJson;
      // If content is same as rawJson, no toggle needed — rawJson stays for copy
      if (content === rawJson) tab.rawJson = null;
    }
  } catch(e) {
    const tab = data.tabs.find(t => t.id === id);
    if (tab) tab.content = 'Error: ' + e.message;
  }
}

// Copy from API to clipboard
async function copyFromApi(url) {
  try {
    const resp = await fetch(url);
    let content = await resp.text();
    try { content = JSON.stringify(JSON.parse(content), null, 2); } catch(e) {}
    await navigator.clipboard.writeText(content);
    showToast('✓ Copied to clipboard');
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast show';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 1500);
}

// Auto-expand agents with findings
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.output-section').forEach(el => {
    let d = el.closest('details');
    if (d) d.open = true;
  });
});
</script>
</body>
</html>
