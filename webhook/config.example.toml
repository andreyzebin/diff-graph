# ── Server ──────────────────────────────────────────────
[server]
port = 8000
# secret = "webhook-secret"  # optional: x-hub-signature verification

# ── Agents ──────────────────────────────────────────────

# DiffGraph v2 — dispatcher handles /help, plain text, unsupported commands;
# passes /review through to the review pipeline
[agents.dg2]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --message="{message}" --comment-id={comment_id}'
timeout = 600

# DiffGraph v1 — no dispatcher, review only (legacy)
[agents.dg1]
trigger = "cli"
command = 'cd ~/repos/diff-graph-v1 && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --post-comments'
timeout = 600

# PR-Agent — forward raw Bitbucket event, it handles everything internally
[agents.pra]
trigger = "webhook"
base_url = "http://pr-agent-host:3000/webhook"
timeout = 300

# ── Events → commands ───────────────────────────────────
[events]
"pr:opened" = ["review"]            # auto-review on PR creation
"pr:comment:added" = "parse"        # /command or plain text → dispatcher
"pr:from_ref_updated" = ["review"]  # re-review on force-push
"repo:refs_changed" = []            # ignore push events

# ── Routes (first match wins, each route is forward OR agent) ────

# Legacy project → forward everything to pr-agent (no dispatcher)
[[routes]]
name = "legacy-forward"
when = "project == 'LEGACY'"
forward = "pra"

# A/B test: 50% pr-agent, 50% DiffGraph v2
[[routes]]
name = "platform-pra"
when = "project == 'PLATFORM'"
forward = "pra"
sample = 50

[[routes]]
name = "platform-dg"
when = "project == 'PLATFORM'"
agent = "dg2"

# Canary repo → DiffGraph v2
[[routes]]
name = "canary"
when = "repo == 'code-review-example-orderflow'"
agent = "dg2"

# Default → DiffGraph v2 for all projects
[[routes]]
name = "default"
when = "true"
agent = "dg2"
