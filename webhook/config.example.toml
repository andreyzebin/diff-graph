# ── Server ──────────────────────────────────────────────
[server]
port = 8000
# secret = "webhook-secret"  # optional: x-hub-signature verification

# ── Agents ──────────────────────────────────────────────

# DiffGraph — dispatcher as entry point (handles /help, /ask, plain text;
# spawns reviewer on /review; lazy clone only when needed).
#
# Common cli.py flags worth wiring through the trigger command:
#   --provider <name>   pick an LLM profile from ~/repos/.llm_creds.toml
#                       (deepseek, qwen3, qwen3-6, ...)
#   --bot-user <slug>   tag own existing comments as [SELF] in context
#                       (alternative: export BOT_USER=<slug> in .env)
#   --trace-dir <path>  mirror per-step LLM/tool traces to disk for inspection
#   --prompts <uri>     pin a prompt set — local path, file://..., or
#                       bitbucket://server/PROJECT/repo/refs/<sha-or-branch>/<dir>.
#                       The directory's name becomes "generation" and the
#                       compiled prompts' content hash becomes "mutation"
#                       (both surface in the dispatcher prompt and trace DB),
#                       so each route can A/B-test a different prompt set.
#   --mocks <path>      tool-mocks fixture (YAML) — short-circuits the
#                       listed tool calls with canned replies. Mockito-
#                       style: each entry is consumed in order. Sticky
#                       entries replay forever (use to disable a tool
#                       indefinitely). Bare-string value at a tool key
#                       is a one-line shortcut for "sticky-return this
#                       string". Drop-in fixture for the common
#                       'set_review_status off' case is shipped at
#                       orchestra/fixtures/mocks/disable-review-status.yaml.
#                       Format: see orchestra/tool_mocks.py.
#
# Example with provider + bot user + pinned prompts version:
#   command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --message="{message}" --comment-id={comment_id} --provider=deepseek --bot-user=review-bot --prompts=bitbucket://server/SBLOOM/diffgraph-prompts/refs/main/prompts'
[agents.dg]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --message="{message}" --comment-id={comment_id}'
timeout = 600

# DiffGraph — dispatcher entry point with set_review_status disabled.
# Same as dg above, but --mocks is passed to the dispatcher (the root
# agent). ToolMocks is inherited by every spawned child — the
# dispatcher's spawned reviewer, and any investigators that reviewer
# spawns in turn — so set_review_status is short-circuited at any
# depth, not just on a directly-invoked reviewer. The dispatcher still
# routes /ask, /help, plain text normally; only the verdict step in
# the /review subtree is silenced.
[agents.dg-no-status]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --message="{message}" --comment-id={comment_id} --mocks=orchestra/fixtures/mocks/disable-review-status.yaml'
timeout = 600

# DiffGraph — dispatcher entry point with the Jira integration off.
# --mocks short-circuits every jira_read_ticket call (at any spawn depth)
# with a canned "Jira is off, work from the diff" reply. Use when the
# Jira PAT has expired, the instance is down, or a given route just
# shouldn't make tracker calls — no prompt or code change needed. The
# agent reads the diff + PR description as usual; only ticket lookups
# are silenced. (Same sticky-mock pattern as dg-no-status; the two
# --mocks files can also be combined into one fixture if you want
# both off.)
[agents.dg-no-jira]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --message="{message}" --comment-id={comment_id} --mocks=orchestra/fixtures/mocks/disable-jira.yaml'
timeout = 600

# DiffGraph — direct reviewer (skip dispatcher, always review)
[agents.dg-review]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --agent=reviewer'
timeout = 600

# DiffGraph — reviewer with set_review_status temporarily disabled.
# Same as dg-review but every set_review_status call short-circuits
# with a canned "disabled" reply (sticky one-liner from
# orchestra/fixtures/mocks/disable-review-status.yaml). The reviewer
# still reads diff, spawns investigators, posts inline comments, and
# finishes — only the PR-status update is silenced. Useful while
# downstream automation around status changes is being reworked or
# while a webhook fan-out is making noise.
[agents.dg-review-no-status]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --agent=reviewer --mocks=orchestra/fixtures/mocks/disable-review-status.yaml'
timeout = 600

# PR-Agent — forward raw Bitbucket event
[agents.pra]
trigger = "webhook"
base_url = "http://pr-agent-host:3000/webhook"
timeout = 300

# ── Events → commands ───────────────────────────────────
[events]
"pr:opened" = ["review"]            # auto-review on PR creation
"pr:comment:added" = "parse"        # /command or plain text → dispatcher
"pr:from_ref_updated" = ["review"]  # re-review on force-push
"repo:refs_changed" = []            # ignore push events

# ── Routes (first match wins, each route is forward OR agent) ────

# Legacy project → forward to pr-agent
[[routes]]
name = "legacy-forward"
when = "project == 'LEGACY'"
forward = "pra"

# A/B test: 50% pr-agent, 50% DiffGraph
[[routes]]
name = "platform-pra"
when = "project == 'PLATFORM'"
forward = "pra"
sample = 50

[[routes]]
name = "platform-dg"
when = "project == 'PLATFORM'"
agent = "dg"

# Default → dispatcher for all, /review goes direct to reviewer
[[routes]]
name = "default"
when = "true"
agent = "dg"
review = "dg-review"          # /review and auto-review → direct reviewer

# ── Health checks (optional) ────────────────────────────────────────
# Keep rented-GPU vLLM endpoints warm during working hours. Each entry
# fires `command` every `interval_seconds` while the local time falls
# inside `time_window` (timezone-aware) and `days` (ISO weekdays
# 1=Mon..7=Sun, empty = all). The command is opaque — typically
# `cli.py health --provider <name> -q`, but anything that exits 0 = ok.
#
# A non-zero exit, a timeout, or a launch error is logged at WARNING.
# Cold-start latency is up to 10–15 min on rented GPUs, so set
# timeout_seconds generously (1200s default = 20 min).
#
# [[health]]
# name = "qwen3-6"
# command = "cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py health --provider qwen3-6 -q"
# interval_seconds = 180        # every 3 min
# timeout_seconds  = 1200       # tolerate cold-start
# time_window      = "09:00-19:00"
# timezone         = "Europe/Moscow"
# days             = [1, 2, 3, 4, 5]   # Mon–Fri only
