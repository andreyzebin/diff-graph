# ── Server ──────────────────────────────────────────────
[server]
port = 8000
# secret = "webhook-secret"  # optional: x-hub-signature verification

# ── Agents ──────────────────────────────────────────────

[agents.dg2]
trigger = "cli"
command = 'cd ~/repos/diff-graph && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --post-comments --command="{command}" --args="{args}" --comment-id={comment_id}'
timeout = 600

[agents.dg1]
trigger = "cli"
command = 'cd ~/repos/diff-graph-v1 && source .env && .venv/bin/python cli.py run --pr-url="{pr_url}" --post-comments'
timeout = 600

[agents.pra]
trigger = "webhook"
base_url = "http://pr-agent-host:3000"    # forward raw BB event
timeout = 300

# ── Events → commands ───────────────────────────────────
[events]
"pr:opened" = ["review"]
"pr:comment:added" = "parse"         # extract /command from comment text
"repo:refs_changed" = []              # nothing on push

# ── Routes (first match wins, each route is forward OR agent) ────

# Legacy project → forward everything to pr-agent
[[routes]]
name = "legacy-forward"
when = "project == 'LEGACY'"
forward = "pra"

# PLATFORM → 50% forward to pr-agent, 50% command routing to dg2
[[routes]]
name = "platform-forward"
when = "project == 'PLATFORM'"
forward = "pra"
sample = 50

[[routes]]
name = "platform-commands"
when = "project == 'PLATFORM'"
agent = "dg2"

# Canary repo → always dg2
[[routes]]
name = "orderflow-canary"
when = "repo == 'code-review-example-orderflow'"
agent = "dg2"

# SBLOOM → command routing, /improve overridden
[[routes]]
name = "sbloom"
when = "project == 'SBLOOM'"
agent = "dg2"
improve = "pra"

# Default
[[routes]]
name = "default"
when = "true"
agent = "dg1"
