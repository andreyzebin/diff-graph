id: SKILL-003-detective-with
agent: detective
tags: [tier:unit, skill:reflect, abstract, detective, multi-fact-deduction, proof-of-value]

bench_cmd: >
  cd {bench_root} && source .env
  && unset ALL_PROXY all_proxy
  && .venv/bin/python -m benchmarks.cli run-unit
  {fixture_path}
  --provider={provider}

# Proof-of-value reflect-skill test — half of an A/B pair with
# SKILL-003-detective-without.
#
# Detective receives a four-suspect murder case and must investigate
# whereabouts/evidence/motive for each (12 tool calls), then accuse
# the unique suspect matching no-alibi + evidence + motive. With the
# reflect skill mounted, the detective gains the `reflect` tool plus
# guidance to bank facts and close question IDs as each axis is
# checked. Expectation: WITH-variant agents reach the deduction step
# with state externalised (won't lose alice's alibi to context drift
# by the time they check dave's motive), while WITHOUT-variant
# agents have to hold all 12 facts in working memory.
#
# Pass criteria — assert via judge + structural:
#   - answer == "bob" (the unique three-condition match per
#     the hardcoded tool data).
#   - Detective invocations contain whereabouts, evidence, motive,
#     reflect (the whole point of this fixture — at least one
#     reflect call to bank running deductions), and answer.
#
# Pair: SKILL-003-detective-without.yaml — same task, no skill.
# Expected: detective calls the three axis tools + answer but
# no reflect. If the WITHOUT variant misidentifies the murderer
# while WITH succeeds, that's the proof-of-value signal — reflect
# materially helps convergence on this task class.

prompt_resource: diffgraph:diffgraph/test_prompts/skills/reflect

user_message_from: diffgraph:diffgraph/test_prompts/skills/reflect/detective-with-skill.user.md

agent_data:
  briefing: |
    The victim, an antiques dealer, was found stabbed in the back
    office of the shop yesterday evening between 19:30 and 21:30.
    Four people had keys to the building: alice (the dealer's
    business partner), bob (a former associate with whom the dealer
    had been in a long-running dispute), carol (a niece who visits
    the shop occasionally), and dave (a friend who sometimes helped
    with appraisals). One of these four killed the victim during
    that two-hour window. Find out who.

expected_output:
  assert_via: [intended_text]
  concern_focuses:
    - id: correct-murderer
      rationale: |
        The detective's answer (intended_text) must contain
        the suspect name "bob" — the only one satisfying the
        three-condition rule (no corroborated alibi + physical
        evidence at scene + known motive). With the reflect skill
        mounted, the detective is expected to derive concerns from
        the briefing, evolve hypotheses via probes, and arrive at
        the correct unique match; the final answer reported has
        to be bob.
  # Structural assertion (deterministic, complements the LLM judge).
  # The detective is free to probe any subset of the axis tools
  # (hypothesis-driven, not exhaustive — reflect-banking should
  # let it solve in fewer probes than the WITHOUT variant), but
  # MUST call reflect at least once and reach answer. The
  # reflect call is what proves the skill is actually being used.
  assert_invocations:
    detective:
      must_call: [reflect, answer]
  thresholds:
    min_score: 0.7
  metadata:
    note: "A/B partner — call-pattern assertion (did detective actually reflect?) is the structural check; the semantic check verifies the correct accusation."

metadata:
  difficulty: medium
  language: any
  pr_size: small
  scenario_type: agent_unit
  capabilities: [detective, multi_fact_deduction, reflect, proof_of_value]
