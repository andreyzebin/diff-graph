id: SKILL-004-cluedo-without
agent: cluedo_player
tags: [tier:unit, skill:reflect, baseline, abstract, cluedo, deductive-reasoning]

bench_cmd: >
  cd {bench_root} && source .env
  && unset ALL_PROXY all_proxy
  && .venv/bin/python -m benchmarks.cli run-unit
  {fixture_path}
  --provider={provider}

# A/B baseline — same Cluedo puzzle as SKILL-004-with, no skill
# mounted. Player has only suggest/answer/done and must
# accumulate the constraint state (eliminated cards, opponent
# attribution, per-category candidate sets) in working memory
# across the multi-suggestion deduction.
#
# This is the proof-of-value sibling to SKILL-003. SKILL-003
# (detective) ended up too easy because the LLM parallelised the
# 12 tool calls into 3 batches and the boolean AND deduction was
# trivial. SKILL-004 (Cluedo) is genuinely hard for current LLMs
# (per arXiv 2603.17169, multi-agent LLMs win only 4/18 simulated
# games at the full 21-card scale; even our reduced 4+4+4 puzzle
# requires constraint propagation across 5-10 sequential
# suggestions). Expectation: WITHOUT-variant agents may misaccuse
# (confuse which card was shown by which opponent, fail to
# propagate "if I know 2 of 3, the disprover MUST hold the third")
# as the suggestion chain accumulates.
#
# Pass criteria:
#   - answer matches the hardcoded envelope "plum, rope,
#     ballroom" (the only three not in the agent's hand or any
#     opponent's hand — the iconic Cluedo trio mustard/knife/
#     library is opp_1's hand, NOT the envelope).
#   - Player invocations contain suggest (the whole point) and
#     answer (the final accusation).
#   - Player invocations do NOT contain reflect (no skill means
#     reflect tool isn't in its registry).

prompt_resource: diffgraph:diffgraph/test_prompts/skills/reflect

user_message_from: diffgraph:diffgraph/test_prompts/skills/reflect/cluedo.user.md

agent_data: {}

expected_output:
  assert_via: [intended_text]
  concern_focuses:
    - id: correct-envelope
      rationale: |
        The player's answer (intended_text) must contain
        ALL THREE envelope cards — "plum" (suspect), "rope"
        (weapon), "ballroom" (room). All three together are
        required for a correct accusation; any one missing or
        substituted (e.g. the iconic Cluedo trio
        mustard/knife/library — that's opp_1's hand here, NOT
        the envelope) is a wrong accusation. Order in the text
        doesn't matter, but the three names do. An empty answer
        means the deduction never converged.
  thresholds:
    min_score: 0.7

metadata:
  difficulty: hard
  language: any
  pr_size: small
  scenario_type: agent_unit
  capabilities: [cluedo_player, deductive_reasoning, constraint_propagation, no_reflect]
