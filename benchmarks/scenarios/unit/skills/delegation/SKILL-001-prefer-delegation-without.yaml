id: SKILL-001-prefer-delegation-without
agent: boss
tags: [tier:unit, skill:prefer_delegation, baseline, abstract]

bench_cmd: >
  cd {bench_root} && source .env
  && unset ALL_PROXY all_proxy
  && .venv/bin/python -m benchmarks.cli run-unit
  {fixture_path}
  --provider={provider}

# A/B baseline — same task as SKILL-001-with (10-input compute),
# no skill mounted. Boss is expected to run do_task sequentially
# itself.
#
# Pass criteria:
#   - intended_text == "42, 14, 200, 10, 66, 32, 98, 16, 120, 22"
#     (doubled inputs, in order).
#   - boss invocations contain do_task.
#   - boss invocations do NOT contain agent_spawn.
#
# Together with the WITH variant this proves the prefer_delegation
# skill actually changes behavior — without it boss does the work
# himself; with it the skill body's rational criteria (parallelism /
# context-window pressure / budget separation / auditability) all
# apply at once and route the boss to fan-out.

prompt_resource: diffgraph:diffgraph/test_prompts/skills/delegation

user_message_from: diffgraph:diffgraph/test_prompts/skills/delegation/boss.user.md

agent_data:
  task_input: "21, 7, 100, 5, 33, 16, 49, 8, 60, 11"

expected_output:
  assert_via: [intended_text]
  concern_focuses:
    - id: doubled-answer
      rationale: |
        The boss's text_answer (intended_text) must contain the
        ten doubled values
        "42, 14, 200, 10, 66, 32, 98, 16, 120, 22" in the SAME
        ORDER as the inputs
        "21, 7, 100, 5, 33, 16, 49, 8, 60, 11". The baseline (no
        skill) variant expects the boss to do the work itself
        by calling do_task ten times sequentially.
  # Structural assertion — the mirror image of SKILL-001-with.
  # Without the prefer_delegation skill, the boss must call do_task
  # itself and must NOT spawn a worker. If this fails, either the
  # skill is leaking somehow or the boss is over-delegating.
  assert_invocations:
    boss:
      must_call: [do_task]
      must_not_call: [agent_spawn]
  thresholds:
    min_score: 0.7
