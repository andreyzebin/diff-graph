id: SKILL-001-prefer-delegation-with
agent: boss
tags: [tier:unit, skill:prefer_delegation, delegation, abstract]

bench_cmd: >
  cd {bench_root} && source .env
  && unset ALL_PROXY all_proxy
  && .venv/bin/python -m benchmarks.cli run-unit
  {fixture_path}
  --provider={provider}

# Abstract delegation test — half of an A/B pair with SKILL-001-without.
#
# Boss receives a fan-out compute task (5 integer inputs, each
# needs do_task to produce its result, then merged). Without the
# skill the boss can reasonably do them sequentially itself; WITH
# the prefer_delegation skill mounted, the skill body's "Multiple
# agent_spawn calls in one step fan out in parallel" guidance is
# the obvious fit and the boss should spawn one worker per input.
# The do_task tool is deterministic (doubles the input) so the
# judge can verify each output.
#
# Pass criteria — assert via judge:
#   - intended_text == "42, 14, 200, 10, 66" (doubled inputs, in order).
#   - boss agent invocations contain agent_spawn (delegated).
#   - boss invocations do NOT contain do_task (workers called it).
#   - worker invocations contain do_task.
#
# Pair: SKILL-001-prefer-delegation-without.yaml — same task,
# no skill. Expected: boss runs 5 sequential do_task calls.

# No `repo:` block — PR-free scenario. bench/cli skip fake_bitbucket
# setup since boss has no diff_* or PR-aware tools.

prompt_resource: diffgraph:diffgraph/test_prompts/skills/delegation

user_message_from: diffgraph:diffgraph/test_prompts/skills/delegation/boss-with-skill.user.md

agent_data:
  task_input: "21, 7, 100, 5, 33"

expected_output:
  assert_via: [intended_text]
  concern_focuses:
    - id: doubled-answer
      rationale: |
        The boss's text_answer (intended_text) must contain the
        five doubled values "42, 14, 200, 10, 66" in the SAME
        ORDER as the inputs "21, 7, 100, 5, 33". With the
        prefer_delegation skill mounted, the boss should fan out
        across workers (one agent_spawn per input — possibly all
        in one step) and synthesize their results into the final
        comma-separated answer. Any ordering OR any wrong number
        means the fan-out / synthesis chain broke.
  # Structural assertion (deterministic, complements the LLM judge).
  # Forces an A/B distinction the semantic answer-check can't see on
  # its own: did the boss ACTUALLY delegate, or just answer "42" itself?
  assert_invocations:
    boss:
      must_call: [agent_spawn]
      must_not_call: [do_task]
    worker:
      must_call: [do_task]
  thresholds:
    min_score: 0.7
